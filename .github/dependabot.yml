version: 2
updates:
  # npm dependencies (root project)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      # vitest and @vitest/* pin each other with exact peer versions, so any bump
      # (majors included) has to land as one PR or `npm ci` fails with ERESOLVE.
      # Listed before npm-minor-patch: a dependency joins the first group it matches.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Bundle all minor + patch bumps into one PR; majors stay separate.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
