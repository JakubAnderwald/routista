name: Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Disable shallow clone for full git history (fixes SCM blame)
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Match the Vercel project's Node version so the lockfile is resolved
          # by the same npm major everywhere (avoids `npm ci` EUSAGE drift).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      # Dev-only advisories cannot always be fixed. eslint@9 and the
      # eslint-plugin-* packages pinned by eslint-config-next all depend on
      # minimatch@3 -> brace-expansion@1, and the only patch for
      # GHSA-mh99-v99m-4gvg is brace-expansion@5, whose CJS export shape is
      # incompatible (object, not a callable). eslint@10 would drop that chain
      # but breaks eslint-plugin-react@7. Advisory *findings* are therefore
      # reported rather than blocking — but a failure to actually run the audit
      # (registry outage, unreadable lockfile, npm CLI error) still fails the
      # job, so real breakage is never silently swallowed.
      - name: Security Audit (all dependencies, informational)
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          status=$?
          set -e

          # A genuine audit run always emits .metadata.vulnerabilities, whether
          # or not anything was found. Its absence means npm never completed.
          if [ "$status" -ne 0 ] && ! jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
            echo "::error::npm audit did not complete - this is an execution failure, not an advisory."
            cat audit.json
            exit 1
          fi

          count=$(jq -r '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' audit.json)
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count high/critical advisories remain in the full tree (dev-only, not blocking)."
            {
              echo "### Informational: $count high/critical advisories (dev-only)"
              jq -r '.vulnerabilities | to_entries[]
                     | select(.value.severity == "high" or .value.severity == "critical")
                     | "- **\(.key)** (\(.value.severity)): `\(.value.range)`"' audit.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No high/critical advisories in the full dependency tree."
          fi

      - name: Linting (including security rules)
        run: npm run lint
        
      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
