name: Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Disable shallow clone for full git history (fixes SCM blame)
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Match the Vercel project's Node version so the lockfile is resolved
          # by the same npm major everywhere (avoids `npm ci` EUSAGE drift).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting (including security rules)
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The audits run LAST, after lint/tests/Sonar, and this order is load-bearing.
      #
      # `npm audit` reads a live advisory database, so it can start failing with no
      # change on our side. When it ran first, that failure short-circuited the whole
      # job: lint, tests and the Sonar scan were skipped, so every open PR lost its
      # test signal — and, because the Sonar step never ran, the required
      # `SonarCloud Code Analysis` check was never posted and PRs stalled waiting for
      # a status that could not arrive. Keep the audits at the end so an advisory
      # fails the job without hiding whether the code actually works.
      - name: Security Audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      # Dev-only advisories cannot always be fixed. Every current high finding
      # traces to one root: GHSA-mh99-v99m-4gvg (brace-expansion DoS), reached
      # via minimatch@3 -> brace-expansion@1. Two independent consumer groups
      # pull it in:
      #
      #   eslint-side:  @eslint/config-array, @eslint/eslintrc  (via eslint@9)
      #   plugin-side:  eslint-plugin-import, eslint-plugin-jsx-a11y,
      #                 eslint-plugin-react  (pinned by eslint-config-next)
      #
      # Neither an eslint bump nor an override clears it, as of 2026-07:
      #
      #   - eslint@10 drops only the eslint-side pair. The three plugins depend
      #     on minimatch@3 themselves, so the findings survive. (It also needs
      #     eslint-plugin-react patched: version.js:31, jsx-filename-extension
      #     .js:64 and forward-ref-uses-ref.js:60 call getFilename/
      #     getSourceCode, removed in eslint@10. Verified as 3 lines, but a
      #     patched transitive dep is not worth a partial audit win.)
      #   - The advisory range is <=5.0.7, so ONLY brace-expansion>=5.0.8 fixes
      #     it, and its CJS export is an object ({expand, ...}), not a callable
      #     — minimatch@3 does `require('brace-expansion')(pattern)`.
      #   - Overriding minimatch does not help either: minimatch@9 still uses
      #     brace-expansion@^2 (also vulnerable), and minimatch@10 moved to
      #     named exports, breaking all five callable consumers above.
      #
      # So advisory *findings* are reported rather than blocking — but a failure
      # to actually run the audit (registry outage, unreadable lockfile, npm CLI
      # error) still fails the job, so real breakage is never silently swallowed.
      # Revisit when eslint-plugin-react ships eslint@10 support upstream.
      - name: Security Audit (all dependencies, informational)
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json
          status=$?
          set -e

          # A genuine audit run always emits .metadata.vulnerabilities, whether
          # or not anything was found. Its absence means npm never completed.
          if [ "$status" -ne 0 ] && ! jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
            echo "::error::npm audit did not complete - this is an execution failure, not an advisory."
            cat audit.json
            exit 1
          fi

          # These findings are labelled by what is actually known — that the blocking
          # production audit above did not fail on them — rather than asserted to be
          # dev-only. The two steps are separate `npm audit` calls against a live
          # advisory feed, so an advisory published between them would show up here
          # while the production audit ran before it existed. Calling that "dev-only"
          # would be a guess; the next run's production audit blocks it either way.
          count=$(jq -r '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' audit.json)
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count high/critical advisories in the full tree, not blocking (see summary)."
            {
              echo "### Informational: $count high/critical advisories not caught by the production audit"
              jq -r '.vulnerabilities | to_entries[]
                     | select(.value.severity == "high" or .value.severity == "critical")
                     | "- **\(.key)** (\(.value.severity)): `\(.value.range)`"' audit.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No high/critical advisories in the full dependency tree."
          fi
